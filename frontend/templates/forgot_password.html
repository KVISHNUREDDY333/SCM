{% extends "base.html" %}

{% block title %}Reset Password - SCMXpertLite{% endblock %}

{% block content %}
<style>
    .recovery-wrapper { min-height: 80vh; display:flex; align-items:center; justify-content:center; }
    .recovery-card { width: 100%; max-width: 450px; }
    .recovery-title { text-align:center; font-size: 1.8rem; margin-bottom: 0.5rem; }
    .recovery-sub { text-align:center; color: var(--text-muted); margin-bottom: 2rem; }
    .recovery-form-btn { width: 100%; justify-content: center; padding: 1rem; }
    .otp-display-pill { background: rgba(0,210,255,0.1); padding: 10px; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; color: var(--primary); font-size: 0.9rem; }
    .otp-display-email { font-weight: bold; }
    .otp-input-field { letter-spacing: 5px; text-align: center; font-size: 1.2rem; }
    .msg-feedback { margin-top: 1rem; text-align: center; min-height: 20px; }
    .back-link-box { text-align: center; margin-top: 2rem; color: var(--text-muted); }
    .back-link { color: white; text-decoration: none; transition: 0.3s; }
    .back-link:hover { color: var(--primary); }

    .step2-form { display: none; animation: fadeInUp 0.5s ease; }

    @media (max-width: 480px) {
        .recovery-title { font-size: 1.5rem; }
        .glass-card { padding: 1.5rem !important; }
    }
</style>

<div class="recovery-wrapper page-fade-in">
    <div class="glass-card recovery-card">
        <h2 class="recovery-title">Reset Password</h2>
        <p class="recovery-sub">Secure Account Recovery</p>

        <!-- STEP 1: Request OTP -->
        <form id="step1Form">
            <div class="form-group">
                <input id="emailInput" type="email" class="form-input" placeholder=" " required title="Registered Email" />
                <label class="form-label" for="emailInput">Registered Email</label>
            </div>
            <button type="submit" class="btn btn-primary recovery-form-btn">
                SEND OTP CODE
            </button>
        </form>

        <!-- STEP 2: Verify OTP & Reset -->
        <form id="step2Form" class="step2-form">
            <div class="otp-display-pill">
                OTP sent to <span id="displayEmail" class="otp-display-email"></span>
            </div>

            <div class="form-group">
                <input id="otpInput" type="text" class="form-input otp-input-field" placeholder=" " maxlength="6" required title="6-Digit OTP" />
                <label class="form-label" for="otpInput">Enter 6-Digit OTP</label>
            </div>

            <div class="form-group">
                <input id="newPassInput" type="password" class="form-input" placeholder=" " minlength="8" required title="New Password" />
                <label class="form-label" for="newPassInput">New Password</label>
            </div>

            <button type="submit" class="btn btn-primary recovery-form-btn">
                UPDATE PASSWORD
            </button>
        </form>
        
        <div id="msg" class="msg-feedback"></div>

        <p class="back-link-box">
            <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const step1 = document.getElementById('step1Form');
    const step2 = document.getElementById('step2Form');
    const msg = document.getElementById('msg');
    let userEmail = "";

    // Handle Send OTP
    step1.addEventListener('submit', async (e) => {
        e.preventDefault();
        userEmail = document.getElementById('emailInput').value;
        msg.innerHTML = '<span style="color:var(--primary)"><i class="fa-solid fa-circle-notch fa-spin"></i> Sending OTP...</span>';

        try {
            const res = await postJSON('/api/v1/forgot-password', { email: userEmail }, false);
            if(res.ok) {
                // Switch UI
                step1.style.display = 'none';
                step2.style.display = 'block';
                document.getElementById('displayEmail').textContent = userEmail;
                msg.textContent = '';
                // Focus on OTP
                document.getElementById('otpInput').focus();
            } else {
                msg.innerHTML = '<span style="color:var(--accent)">Failed to send OTP.</span>';
            }
        } catch(err) { msg.textContent = 'Server Error'; }
    });

    // Handle Reset
    step2.addEventListener('submit', async (e) => {
        e.preventDefault();
        const otp = document.getElementById('otpInput').value;
        const pass = document.getElementById('newPassInput').value;
        
        msg.innerHTML = '<span style="color:var(--primary)"><i class="fa-solid fa-circle-notch fa-spin"></i> Updating...</span>';

        try {
            const res = await postJSON('/api/v1/reset-password', { 
                email: userEmail,
                otp: otp,
                new_password: pass 
            }, false);

            const json = await res.json();
            
            if(res.ok) {
                msg.innerHTML = '<span style="color:#00ff88">Password Changed! Redirecting...</span>';
                setTimeout(() => window.location.href = '/', 1500);
            } else {
                msg.innerHTML = `<span style="color:var(--accent)">${json.detail || 'Invalid OTP'}</span>`;
            }
        } catch(err) { msg.textContent = 'Server Error'; }
    });
</script>
{% endblock %}
