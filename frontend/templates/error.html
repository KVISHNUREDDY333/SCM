{% extends "base.html" %}
{% block title %}Error - SCMXpertLite{% endblock %}
{% block content %}
<style>
    .error-wrapper { display: flex; justify-content: center; align-items: center; min-height: 70vh; }
    .error-card { text-align: center; width: 90%; max-width: 600px; }
    .error-code { font-size: clamp(3rem, 15vw, 6rem); margin: 0; color: var(--primary); text-shadow: 0 0 20px rgba(0,210,255,0.5); }
    .error-title { margin-bottom: 1.5rem; font-size: clamp(1.2rem, 5vw, 1.8rem); }
    .error-desc { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
</style>

<section class="error-wrapper page-fade-in text-center">
    <div class="glass-card error-card">
        <h1 class="error-code">{{ error_code }}</h1>
        <h2 class="error-title">{{ error_message }}</h2>
        <p class="error-desc">The coordinates you are looking for do not exist in our supply chain.</p>
        <a href="/dashboard" class="btn btn-primary">Return to Base</a>
    </div>
</section>
{% endblock %}
