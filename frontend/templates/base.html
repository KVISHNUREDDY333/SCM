<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-client-id" content="{{ GOOGLE_CLIENT_ID }}" />
    <title>{% block title %}SCMXpertLite{% endblock %}</title>
    
    <!-- Favicon from static folder -->
    <link rel="icon" href="/static/favicon.png" type="image/png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00d2ff; /* Cyber Blue */
            --secondary: #3a7bd5;
            --accent: #f89b29; /* Alert Orange */
            --bg-deep: #0a0e17;
            --glass: rgba(20, 30, 48, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --card-radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- LIVE NETWORK BACKGROUND --- */
        #canvas-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a2a3a 0%, #0a0e17 100%);
        }

        /* --- NAVIGATION --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem;
            background: rgba(10, 14, 23, 0.7);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }

        .brand {
            font-size: 1.6rem; font-weight: 700; color: var(--text-main);
            text-decoration: none; display: flex; align-items: center; gap: 10px;
            letter-spacing: 1px;
        }
        .brand i { color: var(--primary); }

        .nav-links { display: flex; gap: 1rem; align-items: center; }
        
        .nav-item {
            color: var(--text-muted); text-decoration: none; font-size: 0.95rem;
            padding: 0.6rem 1.2rem; border-radius: 12px; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        
        .nav-item:hover, .nav-item.active {
            color: white; background: rgba(255,255,255,0.05);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
        }

        .btn {
            padding: 0.7rem 1.5rem; border-radius: 50px; border: none; cursor: pointer;
            font-weight: 600; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white; box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5); }
        .btn-ghost { background: transparent; border: 1px solid var(--glass-border); color: white; }
        .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

        /* --- GLASS CARDS --- */
        .container { max-width: 1600px; margin: 0 auto; padding: 2rem; flex: 1; width: 100%; }
        
        .glass-card {
            background: var(--glass);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FORMS --- */
        .form-group { margin-bottom: 1.5rem; position: relative; }
        .form-label {
            position: absolute; left: 15px; top: 15px; color: var(--text-muted);
            pointer-events: none; transition: 0.3s ease; font-size: 0.9rem;
        }
        .form-input {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border); border-radius: 12px;
            color: white; font-size: 1rem; transition: 0.3s;
        }
        .form-input:focus { border-color: var(--primary); outline: none; background: rgba(0,0,0,0.5); }
        .form-input:focus ~ .form-label, .form-input:not(:placeholder-shown) ~ .form-label {
            top: -10px; left: 10px; font-size: 0.8rem; color: var(--primary);
            background: var(--bg-deep); padding: 0 5px;
        }

        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }

        footer { text-align: center; padding: 2rem; border-top: 1px solid var(--glass-border); color: var(--text-muted); font-size: 0.9rem; margin-top: auto;}

        /* --- TOAST NOTIFICATIONS --- */
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: #0f172a; border: 1px solid var(--primary); color: white;
            padding: 1rem 1.5rem; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 12px; min-width: 300px;
            animation: toastIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 6px solid var(--primary);
        }
        .toast-broadcast { border-color: var(--accent); border-left-color: var(--accent); }
        .toast i { font-size: 1.2rem; }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toastOut { to { transform: translateX(100%); opacity: 0; } }

        /* Responsive */
        @media(max-width: 768px) {
            .navbar { flex-direction: column; gap: 1rem; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
            .glass-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Programmable Background -->
    <canvas id="canvas-bg"></canvas>
    <div class="toast-container" id="toast-container"></div>

    <header class="navbar">
        <a href="/" class="brand"><i class="fa-solid fa-boxes-stacked"></i> SCMXpertLite</a>
        <nav class="nav-links" id="nav-menu"></nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {{ now().year }} SCMXpertLite &bull; Intelligent Logistics
    </footer>

    <!-- Scripts -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // --- 1. Background Animation (The "Live Image" feel) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 210, 255, 0.3)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            }
        }

        for(let i=0; i<60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach((p, index) => {
                p.update(); p.draw();
                // Connect particles
                for(let j=index; j<particles.length; j++){
                    const dx = p.x - particles[j].x;
                    const dy = p.y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 150){
                        ctx.strokeStyle = `rgba(0, 210, 255, ${0.1 - dist/1500})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 2. Auth & Navigation Logic ---
        const apiPrefix = '/api/v1';
        function getToken() { return localStorage.getItem('scm_token'); }
        function setToken(t, role) { 
            if(t) {
                localStorage.setItem('scm_token', t);
                if(role) localStorage.setItem('user_role', role);
                localStorage.setItem('scm_login_time', new Date().toLocaleString());
                localStorage.removeItem('access_token'); 
            } else {
                localStorage.clear();
                sessionStorage.clear();
            }
            updateUI(); 
        }
        
        async function postJSON(url, data, auth=true) {
            const headers = {'Content-Type':'application/json'};
            if(auth && getToken()) headers['Authorization'] = 'Bearer ' + getToken();
            const res = await fetch(url, {method:'POST', headers, body: JSON.stringify(data)});
            if (res.status === 401 || res.status === 403) {
                setToken(null);
                window.location.replace('/');
            }
            return res;
        }
        async function getJSON(url) {
            const headers = {};
            if(getToken()) headers['Authorization'] = 'Bearer ' + getToken();
            const res = await fetch(url, {headers});
            if (res.status === 401 || res.status === 403) {
                setToken(null);
                window.location.replace('/');
            }
            return res;
        }

        async function updateUI() {
            const nav = document.getElementById('nav-menu');
            const token = getToken();
            if(token) {
                try {
                    const res = await getJSON('/api/v1/me');
                    if(res.ok) {
                        const user = await res.json();
                        
                        // Update role and login time in storage if needed
                        if(user.role) localStorage.setItem('user_role', user.role);
                        if(user.last_login && !localStorage.getItem('scm_login_time')) {
                             localStorage.setItem('scm_login_time', new Date(user.last_login).toLocaleString());
                        }

                        let adminLink = '';
                        let roleBadge = `<span style="font-size:0.7rem; padding:2px 8px; border-radius:10px; background:rgba(255,255,255,0.1); color:var(--text-muted); margin-left:5px; border:1px solid var(--glass-border); text-transform:uppercase; font-weight:600;">${user.role || 'User'}</span>`;
                        
                        if(user.is_admin) {
                            adminLink = `
                                <a href="/data-stream" class="nav-item"><i class="fa-solid fa-wifi"></i> Stream</a>
                                <a href="/admin" class="nav-item" style="color:var(--accent); border:1px solid var(--accent);"><i class="fa-solid fa-shield-halved"></i> Admin Panel</a>
                            `;
                            roleBadge = `<span style="font-size:0.7rem; padding:2px 8px; border-radius:10px; background:rgba(248, 155, 41, 0.1); color:var(--accent); margin-left:5px; border:1px solid var(--accent); text-transform:uppercase; font-weight:600;">Admin</span>`;
                        }

                        nav.innerHTML = `
                            <a href="/dashboard" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                            <a href="/create-shipment" class="nav-item"><i class="fa-solid fa-plus"></i> Create</a>
                            <a href="/my-shipments" class="nav-item"><i class="fa-solid fa-truck"></i> Shipments</a>
                            <a href="/account" class="nav-item"><i class="fa-solid fa-user-astronaut"></i> Account ${roleBadge}</a>
                            ${adminLink}
                            <button id="btn-logout" class="btn btn-ghost" style="margin-left:10px">Logout</button>
                        `;
                        document.getElementById('btn-logout').addEventListener('click', async () => { 
                            try {
                                await fetch('/api/v1/logout', { 
                                    method: 'POST', 
                                    headers: { 'Authorization': 'Bearer ' + getToken() } 
                                });
                            } catch(e) { console.error("Logout notification failed", e); }
                            document.cookie = "scm_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;"; // Clear session cookie
                            localStorage.clear();
                            sessionStorage.clear();
                            setToken(null); 
                            window.location.href='/'; 
                        });
                    }
                } catch(e) { console.error("UI update failed", e); }
            } else {
                nav.innerHTML = '';
            }
        }
        document.addEventListener('DOMContentLoaded', updateUI);

        // --- 3. Global Broadcast System & Notifications ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'broadcast' ? 'toast-broadcast' : ''}`;
            const icon = type === 'broadcast' ? 'fa-bullhorn' : 'fa-circle-info';
            const color = type === 'broadcast' ? 'var(--accent)' : 'var(--primary)';
            
            toast.innerHTML = `
                <i class="fa-solid ${icon}" style="color:${color}"></i>
                <div>
                    <div style="font-size:0.75rem; color:${color}; font-weight:700; text-transform:uppercase;">${type === 'broadcast' ? 'Global Announcement' : 'System Notification'}</div>
                    <div style="font-size:0.95rem;">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.5s forwards';
                setTimeout(() => toast.remove(), 500);
            }, 8000);
        }

        // Shared Broadcast Listener
        function initBroadcastListener() {
            if(!getToken()) return;
            const source = new EventSource('/api/v1/events', { withCredentials: true });
            source.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(data.type === 'broadcast') {
                    showToast(data.content, 'broadcast');
                }
            };
            source.onerror = () => { source.close(); setTimeout(initBroadcastListener, 10000); };
        }
        document.addEventListener('DOMContentLoaded', initBroadcastListener);

        // Prevent Back Button access after logout (BFCache handling)
        window.addEventListener('pageshow', function(event) {
            const token = getToken();
            const publicRoutes = ['/', '/signup', '/forgot-password'];
            const currentPath = window.location.pathname;
            
            // If logged out but trying to view an inner page, redirect to home
            if (!token && !publicRoutes.includes(currentPath)) {
                window.location.replace('/');
            }
            
            // If logged in but somehow hit the login page, redirect to dashboard
            if (token && publicRoutes.includes(currentPath)) {
                window.location.replace('/dashboard');
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
