<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance - SCMXpertLite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #111827;
            --primary: #3b82f6;
            --accent: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        /* Subtle Grid Background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .container {
            max-width: 680px;
            width: 90%;
            padding: 60px 40px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 32px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            position: relative;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .icon-box {
            font-size: 64px;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box i {
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.3));
        }

        .status-badge {
            background: rgba(59, 130, 246, 0.05);
            color: var(--primary);
            padding: 10px 24px;
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid rgba(59, 130, 246, 0.2);
            letter-spacing: 0.5px;
        }

        h1 { 
            font-size: 3.5rem; 
            margin-bottom: 24px; 
            font-weight: 700; 
            color: var(--primary);
            letter-spacing: -1px;
        }

        p { 
            color: var(--text-muted); 
            font-size: 1.2rem; 
            line-height: 1.6; 
            margin-bottom: 48px;
            max-width: 540px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 400;
        }

        .footer {
            font-size: 0.9rem;
            color: rgba(148, 163, 184, 0.6);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .gear-1 { animation: rotate 12s linear infinite; }
        .gear-2 { 
            font-size: 44px; 
            margin-left: -15px; 
            margin-top: 15px; 
            animation: rotate-reverse 12s linear infinite; 
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotate-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container { padding: 40px 20px; }
            h1 { font-size: 2.5rem; }
            p { font-size: 1.1rem; }
            .header-section { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <div class="icon-box">
                <i class="fa-solid fa-gear gear-1"></i>
                <i class="fa-solid fa-gear gear-2"></i>
            </div>
            <div class="status-badge">System-Wide Update in Progress</div>
        </div>
        
        <h1>Maintenance Mode</h1>
        
        <p>Our engineers are currently refining the SCMXpertLite telemetry core. We'll be back online shortly with improved intelligence and speed.</p>
        
        <div class="footer">
            &copy; 2026 SCMXpertLite &bull; Intelligent Logistics Command
        </div>
    </div>
</body>
</html>
