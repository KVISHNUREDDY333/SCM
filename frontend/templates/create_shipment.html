{% extends "base.html" %}

{% block title %}Create Shipment - SCMXpertLite{% endblock %}

{% block content %}
<style>
    .container {
        width: 100% !important;
        max-width: 95% !important;
        padding-top: 1rem !important;
        padding-bottom: 1rem !important;
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    section { flex: 1; display: flex; flex-direction: column; }
    .layout-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; align-items: stretch; flex: 1; min-height: 70vh; }
    .glass-card { padding: 2rem !important; display: flex; flex-direction: column; }
    .form-group { margin-bottom: 1.2rem !important; }
    .form-input { padding: 12px !important; font-size: 0.95rem !important; }
    .form-label { top: 12px !important; font-size: 0.95rem !important; }
    .form-input:focus ~ .form-label, .form-input:not(:placeholder-shown) ~ .form-label {
        top: -10px !important;
        font-size: 0.8rem !important;
    }
    .page-title { margin-bottom: 0.5rem; font-size: 1.5rem; }
    .page-subtitle { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; flex: 1; }
    .color-scheme-dark { color-scheme: dark; }
    .date-label { top:-10px !important; left:10px; background:var(--bg-deep); color:var(--primary); font-size:0.8rem !important; }
    .summary-card { display: flex; flex-direction: column; height: 100%; }
    .summary-title { color: var(--secondary); margin-bottom: 1.5rem; font-size: 1.2rem; }
    .flex-1 { flex: 1; display: flex; flex-direction: column; }
    .textarea-full { height: 100%; resize: none; min-height: 150px; flex: 1; }
    .action-buttons { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .btn-full { justify-content: center; width: 100%; padding: 1rem; font-size: 1.1rem; }
    .btn-clear { background: #ff4757; color: white; justify-content: center; width: 100%; border: none; padding: 1rem; font-size: 1.1rem; }
    .msg-box { text-align: center; margin-top: 1rem; min-height: 1.2rem; font-size: 1rem; }
</style>
<section>
    <!-- Layout: 2 Columns (Form Left, Summary Right) -->
    <div class="layout-grid">
        
        <!-- LEFT PANEL: FORM FIELDS -->
        <div class="glass-card">
            <h2 class="page-title">Create New Shipment</h2>
            <p class="page-subtitle">Please fill in all the details below.</p>
            
            <form id="createForm">
                <div class="form-grid">
                    
                    <!-- Row 1: Identifiers -->
                    <div class="form-group">
                        <input id="Shipment_Number" name="Shipment_Number" type="text" class="form-input" placeholder=" " title="Shipment Number" required />
                        <label for="Shipment_Number" class="form-label">Shipment Number*</label>
                    </div>
                    <div class="form-group">
                        <input id="Container_number" name="Container_number" type="text" class="form-input" placeholder=" " title="Container Number" required />
                        <label for="Container_number" class="form-label">Container Number*</label>
                    </div>

                    <!-- Row 2: Route Splitting (From -> To) -->
                    <div class="form-group">
                        <input id="route_from" type="text" class="form-input" placeholder=" " title="Origin" required />
                        <label for="route_from" class="form-label">From (Origin)*</label>
                    </div>
                    <div class="form-group">
                        <input id="route_to" type="text" class="form-input" placeholder=" " title="Destination" required />
                        <label for="route_to" class="form-label">To (Destination)*</label>
                    </div>

                    <!-- Row 3: Goods & Device -->
                    <div class="form-group">
                        <input id="Goods_Type" name="Goods_Type" type="text" class="form-input" placeholder=" " title="Goods Type" required />
                        <label for="Goods_Type" class="form-label">Goods Type*</label>
                    </div>
                    <div class="form-group">
                        <input id="Device" name="Device" type="text" class="form-input" placeholder=" " title="Device" required />
                        <label for="Device" class="form-label">Device*</label>
                    </div>

                    <!-- Row 4: Date & PO -->
                    <div class="form-group">
                        <input id="Expected_Delivery_Date" name="Expected_Delivery_Date" type="datetime-local" class="form-input color-scheme-dark" title="Expected Delivery Date" required />
                        <label for="Expected_Delivery_Date" class="form-label date-label">Expected Delivery Date*</label>
                    </div>
                    <div class="form-group">
                        <input id="Po_Number" name="Po_Number" type="text" class="form-input" placeholder=" " title="PO Number" required />
                        <label for="Po_Number" class="form-label">PO Number*</label>
                    </div>

                    <!-- Row 5: Delivery & NDC -->
                    <div class="form-group">
                        <input id="Delivery_Number" name="Delivery_Number" type="text" class="form-input" placeholder=" " title="Delivery Number" />
                        <label for="Delivery_Number" class="form-label">Delivery Number*</label>
                    </div>
                    <div class="form-group">
                        <input id="NDC_Number" name="NDC_Number" type="text" class="form-input" placeholder=" " title="NDC Number" required />
                        <label for="NDC_Number" class="form-label">NDC Number*</label>
                    </div>

                    <!-- Row 6: Batch & Serial -->
                    <div class="form-group">
                        <input id="Batch_ID" name="Batch_ID" type="text" class="form-input" placeholder=" " title="Batch ID" />
                        <label for="Batch_ID" class="form-label">Batch Id*</label>
                    </div>
                    <div class="form-group">
                        <input id="Serial_Number_of_Goods" name="Serial_Number_of_Goods" type="text" class="form-input" placeholder=" " title="Serial number of Goods" required />
                        <label for="Serial_Number_of_Goods" class="form-label">Serial number of Goods*</label>
                    </div>
                </div>
            </form>
        </div>

        <!-- RIGHT PANEL: SUMMARY & ACTIONS -->
        <div class="glass-card summary-card">
            <h3 class="summary-title"><i class="fa-solid fa-clipboard-check"></i> Summary</h3>
            
            <div class="form-group flex-1">
                <textarea id="Shipment_Description" form="createForm" name="Shipment_Description" class="form-input textarea-full" placeholder=" " title="Shipment Description"></textarea>
                <label for="Shipment_Description" class="form-label">Shipment Description*</label>
            </div>

            <div class="action-buttons">
                <button type="submit" form="createForm" class="btn btn-primary btn-full">
                    CREATE SHIPMENT
                </button>
                <button type="button" onclick="document.getElementById('createForm').reset()" class="btn btn-clear">
                    CLEAR DETAILS
                </button>
            </div>
            
            <div id="msg" class="msg-box"></div>
        </div>

    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Gather Form Data
        const formData = new FormData(e.target);
        const raw = Object.fromEntries(formData.entries());

        // 1. COMBINE 'FROM' AND 'TO' INTO 'Route_Details' FOR BACKEND
        const fromLoc = document.getElementById('route_from').value;
        const toLoc = document.getElementById('route_to').value;
        raw.Route_Details = `${fromLoc} -> ${toLoc}`;

        // 2. Fix Date Format (ISO 8601)
        if(raw.Expected_Delivery_Date) {
            raw.Expected_Delivery_Date = new Date(raw.Expected_Delivery_Date).toISOString();
        }

        // 3. Remove 'Delivery_Number' if backend model doesn't accept it
        delete raw.Delivery_Number; 

        const msg = document.getElementById('msg');
        msg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';
        
        try {
            const res = await postJSON('/api/v1/shipments', raw, true);
            if(res.ok) {
                msg.innerHTML = '<span style="color:#00ff88">Shipment Created Successfully!</span>';
                setTimeout(() => window.location.href = '/my-shipments', 1000);
            } else {
                const err = await res.json();
                msg.innerHTML = `<span style="color:#ff4757">${err.detail || 'Failed to create.'}</span>`;
            }
        } catch(err) { 
            console.error(err);
            msg.innerHTML = '<span style="color:#ff4757">Server connection error.</span>'; 
        }
    });
</script>
{% endblock %}
